name: Security analysis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b \
            git /repo --redact --log-opts="--all"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t parceldesk:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parceldesk:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
